[project]
name = "segppd-cbir"
version = "0.1.0"
description = "Training-free frozen ResNet50 + exact Euclidean CBIR on SegPPD-101"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch",
  "torchvision",
  "pillow",
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "matplotlib",
  "tqdm",
  "pyyaml",
  "imagehash",
  "faiss-cpu",
  "pytest",
  "streamlit",
  "pyarrow",
  "opencv-python-headless",
  "rarfile",
  "scikit-image>=0.26.0",
  "timm>=1.0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/segppd_cbir"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CPU-only torch: the CUDA wheels are multi-GB and the network here is ~250 KB/s;
# ResNet50 inference over ~2.3k images is minutes on CPU. See docs/RUN_LOG.md.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
